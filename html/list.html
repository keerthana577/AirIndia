<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <!-- list tag 
        1. ordered list 
            type="1" (default), A, a, I, i 
            start="101"

        2. unordered list 
            type="disc" (default)  square ,circle

        3. definition list 
        dl - definition list 
        dt - definition term
        dd - definition data 
    -->

    <h2>Ordered list</h2>

    <ol type="A" start="101">
        <li>Chennai</li>
        <li>Trichy</li>
        <li>Karur</li>
    </ol>

    <h2>Unordered List</h2>

    <ul type="circle">
        <li>HTML</li>
        <li>CSS</li>
        <li>Js</li>
    </ul>

    <h2>Definition List</h2>

    <dl>
        <dt>Java : </dt>
        <dd>Java is a programming language.</dd>

        <dt>HTML:</dt>
        <dd>Hyper Text Markup Language.</dd>
    </dl>

</body>
</html>
