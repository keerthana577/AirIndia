<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,th,td{
            border: 2px solid red;
            border-collapse: collapse;
            padding: 5px;
        }
    </style>


</head>
<body>
    
    <table>
        <caption>User Details</caption>
        <thead>
            <tr>
                <th>Sno</th>
                <th>Name</th>
                <th>City</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>1</td>
                <td>Keerthana</td>
                <td>Chennai</td>
            </tr>
            <tr>
                <td>2</td>
                <td>sanjai</td>
                <td>Chennai</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Keerthana</td>
                <td>Chennai</td>
            </tr>
        </tbody>

    </table>

    <br><br>
    <!-- colspan -->
    <table>

        <caption>colspan</caption>

        <thead> 
            <tr>
                <th colspan="3">Front end</th>
            </tr>
        </thead>

        <tbody> 
            <tr>
                <td>html</td>
                <td>css</td>
                <td>js</td>
            </tr>
        </tbody>
    </table>

<br><br>

    <!-- Rowspan -->
    <table>
        <caption>Rowspan</caption>

        <thead></thead>

        <tbody>
            <tr>
                <td rowspan="4">Front end</td>
            </tr>
            <tr>
                <td>html</td>
            </tr>
            <tr>
                <td>css</td>
            </tr>
            <tr>
                <td>js</td>
            </tr>
        </tbody>
    </table>


</body>
</html>
